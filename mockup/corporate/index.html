<!doctype html>

<meta charset="utf-8">
<!-- Same app, different skin. Paths are relative to the parent folder; clicks on #hash links are handled in corporate/js/skin.js. -->
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAR EST · Corporate</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Corporate design variant of the FAR EST windows and doors webshop.">
<meta name="theme-color" content="#0f2a43">
<script>/* before the first paint: the attributes applyEnv() (js/app.js) sets from data/config.js layouts, so the frame, header and tab bar are laid out once and do not move when the app boots */
(function(){var d=document.documentElement,s={};try{s=JSON.parse(localStorage.getItem('farest.corp.v1'))||{}}catch(e){}
var w=innerWidth,l=s.layout||'auto',e=l!=='auto'?l:w>=1100?'wide':w>=700?'regular':'compact',W={compact:420,regular:860,wide:1280};
d.dataset.layout=l;d.dataset.eff=e;d.dataset.nav=e==='compact'?'tabs':'bar';d.style.setProperty('--cols',{compact:1,regular:2,wide:3}[e]);d.style.setProperty('--frame-w',l==='auto'?'100%':W[l]+'px');if(s.surface==='flat'||(s.surface!=='glass'&&s.slow))d.setAttribute('data-flat','');})();</script>
<link rel="manifest" href="manifest.webmanifest">
<!-- boot data (FE.config.content, read by FE.loadAll): fetched in parallel with the scripts instead of after them -->
<script>/* Safari (WebKit) does not reuse fetch preloads for fetch() and downloads them twice, so they are added only elsewhere */
if(!/^Apple/.test(navigator.vendor))['products.csv','configurator.json','api-contract.json','shops.yaml','offers.json','faq.yaml','site-images.yaml'].forEach(function(f){var l=document.createElement('link');l.rel='preload';l.as='fetch';l.crossOrigin='';l.href='content/'+f;document.head.appendChild(l);});</script>
